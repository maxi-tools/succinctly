name: Commit Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commit-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-check:
    name: Commit Message Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Nothing downstream authenticates to GitHub: the version is
          # pinned so no tag lookup happens, the release download is public,
          # and both the lint and the self-test read the local clone only.
          persist-credentials: false

      # `lint` is the deterministic half of omni-dev-commit-check: no model,
      # no API key, no per-run spend. Rules come from
      # .omni-dev/commit-rules.yaml and .omni-dev/scopes.yaml.
      #
      # Both the action and the binary are pinned so the gate cannot change
      # under us: `@v1` is a mutable tag whose composite script decides which
      # flags omni-dev receives, and `version: latest` would re-resolve the
      # rule set on every run. Pinning the version also means the step never
      # hits api.github.com to resolve a tag — that lookup is rate-limited on
      # shared runner IPs, and the action carries three retries for it.
      #
      # skip-on-main is off: the run costs nothing, and a check that
      # short-circuits on the trunk is a check nobody notices has broken.
      # On main the commit range is empty, so this step lints nothing and
      # instead proves the binary installs and both config files parse; the
      # self-test below is what asserts the rules actually bite.
      - name: Lint commit messages
        uses: action-works/omni-dev-commit-check@5e030432773a69203a85741b9a4e844eb9af9a78 # v1
        with:
          command: lint
          version: 0.43.0
          skip-on-main: false
          strict: true
          verbose: true

      # A linter that accepts everything is indistinguishable from a working
      # one, so assert the opposite: one message per rule that must be
      # rejected, plus messages that must be accepted.
      - name: Self-test the commit-message rules
        if: ${{ !cancelled() }}
        run: scripts/test-commit-lint.sh
