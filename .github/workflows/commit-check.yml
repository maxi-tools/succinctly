name: Commit Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commit-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-check:
    name: Commit Message Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `lint` is the deterministic half of omni-dev-commit-check: no model,
      # no API key, no per-run spend. Rules come from
      # .omni-dev/commit-rules.yaml and .omni-dev/scopes.yaml.
      #
      # The version is pinned rather than `latest` so the gate can't change
      # under us, and so the step never hits api.github.com to resolve a tag
      # (that lookup is rate-limited on shared runner IPs and the action
      # already carries retry logic for it).
      #
      # skip-on-main is off: the run costs nothing, and a check that
      # short-circuits on the trunk is a check nobody notices has broken.
      # On main the commit range is empty, so this step lints nothing and
      # instead proves the binary installs and both config files parse; the
      # self-test below is what asserts the rules actually bite.
      - name: Lint commit messages
        uses: action-works/omni-dev-commit-check@v1
        with:
          command: lint
          version: 0.43.0
          skip-on-main: false
          strict: true
          verbose: true

      # A linter that accepts everything is indistinguishable from a working
      # one, so assert the opposite: one message per rule that must be
      # rejected, plus messages that must be accepted.
      - name: Self-test the commit-message rules
        if: ${{ !cancelled() }}
        run: scripts/test-commit-lint.sh
